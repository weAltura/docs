<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Wealtura Documentation</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Wealtura Server - Comprehensive internal documentation">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <style>
    /* Slate Minimal B&W Theme - Inspired by shadcn */

    /* CSS Variables - Slate Palette */
    :root {
      --slate-50: #f8fafc;
      --slate-100: #f1f5f9;
      --slate-200: #e2e8f0;
      --slate-300: #cbd5e1;
      --slate-400: #94a3b8;
      --slate-500: #64748b;
      --slate-600: #475569;
      --slate-700: #334155;
      --slate-800: #1e293b;
      --slate-900: #0f172a;
      --slate-950: #020617;

      /* Light mode (default) */
      --border: var(--slate-200);
      --bg: #ffffff;
      --bg-secondary: var(--slate-50);
      --text: var(--slate-900);
      --text-secondary: var(--slate-600);
      --sidebar-bg: var(--slate-50);
      --sidebar-border: var(--slate-200);
      --code-bg: var(--slate-100);
      --code-border: var(--slate-200);
      --link-color: var(--slate-900);
      --link-hover: var(--slate-900);
      --search-shadow: rgba(0, 0, 0, 0.1);
    }

    /* Dark mode */
    [data-theme="dark"] {
      --border: var(--slate-800);
      --bg: var(--slate-950);
      --bg-secondary: var(--slate-900);
      --text: var(--slate-50);
      --text-secondary: var(--slate-400);
      --sidebar-bg: var(--slate-900);
      --sidebar-border: var(--slate-800);
      --code-bg: var(--slate-900);
      --code-border: var(--slate-800);
      --link-color: var(--slate-200);
      --link-hover: var(--slate-50);
      --search-shadow: rgba(0, 0, 0, 0.3);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --border: var(--slate-800);
        --bg: var(--slate-950);
        --bg-secondary: var(--slate-900);
        --text: var(--slate-50);
        --text-secondary: var(--slate-400);
        --sidebar-bg: var(--slate-900);
        --sidebar-border: var(--slate-800);
        --code-bg: var(--slate-900);
        --code-border: var(--slate-800);
        --link-color: var(--slate-200);
        --link-hover: var(--slate-50);
        --search-shadow: rgba(0, 0, 0, 0.3);
      }
    }

    /* Base Styles */
    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
      line-height: 1.6;
    }

    /* Sidebar Styles */
    .sidebar {
      background-color: var(--sidebar-bg) !important;
      border-right: 1px solid var(--sidebar-border) !important;
      width: 300px;
      padding: 2rem 0;
    }

    .sidebar ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .sidebar ul li {
      margin: 0;
      padding: 0;
    }

    .sidebar ul li a {
      display: block;
      padding: 0.5rem 1.5rem;
      color: var(--text-secondary);
      text-decoration: none;
      transition: all 0.2s ease;
      border-left: 2px solid transparent;
      font-size: 0.875rem;
    }

    .sidebar ul li a:hover {
      color: var(--text);
      background-color: var(--bg);
      border-left-color: var(--slate-400);
    }

    .sidebar ul li.active > a {
      color: var(--text);
      font-weight: 500;
      background-color: var(--bg);
      border-left-color: var(--slate-900);
    }

    [data-theme="dark"] .sidebar ul li.active > a {
      border-left-color: var(--slate-200);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .sidebar ul li.active > a {
        border-left-color: var(--slate-200);
      }
    }

    .sidebar ul li ul {
      margin-left: 0;
      padding-left: 0;
    }

    .sidebar ul li ul li a {
      padding-left: 2.5rem;
      font-size: 0.8125rem;
    }

    .sidebar ul li ul li ul li a {
      padding-left: 3.5rem;
    }

    /* App Name */
    .app-name {
      padding: 1.5rem 1.5rem 1rem;
      border-bottom: 1px solid var(--sidebar-border);
      margin-bottom: 1rem;
    }

    .app-name-link {
      color: var(--text) !important;
      font-size: 1.25rem;
      font-weight: 600;
      text-decoration: none;
    }

    .app-name-link img {
      max-width: 200px;
      margin-bottom: 10px;
    }

    /* Main Content */
    .content {
      background-color: var(--bg);
      padding: 3rem 4rem;
    }

    .markdown-section {
      max-width: 900px;
      margin: 0 auto;
      color: var(--text);
    }

    .markdown-section h1,
    .markdown-section h2,
    .markdown-section h3,
    .markdown-section h4,
    .markdown-section h5,
    .markdown-section h6 {
      color: var(--text);
      font-weight: 600;
      margin-top: 2rem;
      margin-bottom: 1rem;
      line-height: 1.3;
    }

    .markdown-section h1 {
      font-size: 2.25rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.5rem;
      margin-top: 0;
    }

    .markdown-section h2 {
      font-size: 1.75rem;
      margin-top: 2.5rem;
    }

    .markdown-section h3 {
      font-size: 1.5rem;
    }

    .markdown-section h4 {
      font-size: 1.25rem;
    }

    .markdown-section p {
      color: var(--text);
      margin-bottom: 1rem;
    }

    .markdown-section a {
      color: var(--link-color);
      text-decoration: underline;
      text-decoration-color: var(--slate-300);
      text-underline-offset: 2px;
      transition: all 0.2s ease;
    }

    .markdown-section a:hover {
      text-decoration-color: var(--link-hover);
    }

    [data-theme="dark"] .markdown-section a {
      text-decoration-color: var(--slate-600);
    }

    [data-theme="dark"] .markdown-section a:hover {
      text-decoration-color: var(--slate-200);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .markdown-section a {
        text-decoration-color: var(--slate-600);
      }
      :root:not([data-theme="light"]) .markdown-section a:hover {
        text-decoration-color: var(--slate-200);
      }
    }

    /* Code Blocks */
    .markdown-section pre {
      background-color: var(--code-bg) !important;
      border: 1px solid var(--code-border) !important;
      border-radius: 6px;
      padding: 1rem;
      overflow-x: auto;
      margin: 1.5rem 0;
      font-size: 0.875rem;
      line-height: 1.6;
    }

    .markdown-section code {
      background-color: var(--code-bg);
      border: 1px solid var(--code-border);
      border-radius: 4px;
      padding: 0.125rem 0.375rem;
      font-size: 0.875em;
      font-family: 'SF Mono', Monaco, 'Cascadia Code', 'Roboto Mono', Consolas, 'Courier New', monospace;
      color: var(--text);
    }

    .markdown-section pre code {
      background-color: transparent;
      border: none;
      padding: 0;
      color: var(--text);
    }

    /* Tables */
    .markdown-section table {
      display: table;
      width: 100%;
      border-collapse: collapse;
      margin: 1.5rem 0;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }

    .markdown-section table th {
      background-color: var(--bg-secondary);
      font-weight: 600;
      padding: 0.75rem 1rem;
      text-align: left;
      border-bottom: 1px solid var(--border);
      color: var(--text);
    }

    .markdown-section table td {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
      color: var(--text);
    }

    .markdown-section table tr:last-child td {
      border-bottom: none;
    }

    .markdown-section table tr:hover {
      background-color: var(--bg-secondary);
    }

    /* Lists */
    .markdown-section ul,
    .markdown-section ol {
      margin: 1rem 0;
      padding-left: 1.5rem;
      color: var(--text);
    }

    .markdown-section li {
      margin: 0.5rem 0;
      color: var(--text);
    }

    /* Blockquotes */
    .markdown-section blockquote {
      border-left: 3px solid var(--slate-300);
      padding-left: 1rem;
      margin: 1.5rem 0;
      color: var(--text-secondary);
      font-style: italic;
    }

    /* Horizontal Rules */
    .markdown-section hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 2rem 0;
    }

    /* Search */
    .search {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--sidebar-border);
    }

    .search input {
      width: 100%;
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background-color: var(--bg);
      color: var(--text);
      font-size: 0.875rem;
      transition: all 0.2s ease;
    }

    .search input:focus {
      outline: none;
      border-color: var(--slate-400);
      box-shadow: 0 0 0 3px rgba(148, 163, 184, 0.1);
    }

    .search input::placeholder {
      color: var(--slate-400);
    }

    /* Search Results */
    .search .results {
      background-color: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      box-shadow: 0 4px 6px -1px var(--search-shadow);
    }

    .search .results li {
      border-bottom: 1px solid var(--border);
    }

    .search .results li:last-child {
      border-bottom: none;
    }

    .search .results a {
      color: var(--text);
      padding: 0.75rem 1rem;
      display: block;
    }

    .search .results a:hover {
      background-color: var(--bg-secondary);
    }

    /* Copy Code Button */
    .docsify-copy-code-button {
      background-color: var(--slate-800) !important;
      color: white !important;
      border-radius: 4px !important;
      padding: 0.375rem 0.75rem !important;
      font-size: 0.75rem !important;
      transition: all 0.2s ease !important;
    }

    .docsify-copy-code-button:hover {
      background-color: var(--slate-900) !important;
    }

    [data-theme="dark"] .docsify-copy-code-button {
      background-color: var(--slate-700) !important;
    }

    [data-theme="dark"] .docsify-copy-code-button:hover {
      background-color: var(--slate-600) !important;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .docsify-copy-code-button {
        background-color: var(--slate-700) !important;
      }
      :root:not([data-theme="light"]) .docsify-copy-code-button:hover {
        background-color: var(--slate-600) !important;
      }
    }

    /* Pagination */
    .pagination {
      margin-top: 3rem;
      padding-top: 2rem;
      border-top: 1px solid var(--border);
    }

    .pagination-item {
      color: var(--text);
      text-decoration: none;
      padding: 0.5rem 1rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      transition: all 0.2s ease;
    }

    .pagination-item:hover {
      background-color: var(--bg-secondary);
      border-color: var(--slate-400);
    }

    /* Loading */
    #app {
      color: var(--text);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .content {
        padding: 2rem 1.5rem;
      }

      .sidebar {
        width: 100%;
      }
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg-secondary);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--slate-300);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--slate-400);
    }

    [data-theme="dark"] ::-webkit-scrollbar-thumb {
      background: var(--slate-600);
    }

    [data-theme="dark"] ::-webkit-scrollbar-thumb:hover {
      background: var(--slate-500);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) ::-webkit-scrollbar-thumb {
        background: var(--slate-600);
      }
      :root:not([data-theme="light"]) ::-webkit-scrollbar-thumb:hover {
        background: var(--slate-500);
      }
    }

    /* Dark Mode Toggle Button */
    .theme-toggle {
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 1000;
      background-color: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.5rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 2.5rem;
      height: 2.5rem;
      transition: all 0.2s ease;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
    }

    .theme-toggle:hover {
      background-color: var(--bg-secondary);
      border-color: var(--slate-400);
    }

    .theme-toggle svg {
      width: 1.25rem;
      height: 1.25rem;
      stroke: var(--text);
      transition: all 0.2s ease;
    }

    .theme-toggle .sun-icon {
      display: block;
    }

    .theme-toggle .moon-icon {
      display: none;
    }

    [data-theme="dark"] .theme-toggle .sun-icon {
      display: none;
    }

    [data-theme="dark"] .theme-toggle .moon-icon {
      display: block;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .theme-toggle .sun-icon {
        display: none;
      }
      :root:not([data-theme="light"]) .theme-toggle .moon-icon {
        display: block;
      }
    }

    @media (max-width: 768px) {
      .theme-toggle {
        top: 0.5rem;
        right: 0.5rem;
        width: 2rem;
        height: 2rem;
      }
    }
  </style>
</head>
<body>
  <!-- Dark Mode Toggle -->
  <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">
    <svg class="sun-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
    </svg>
    <svg class="moon-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
    </svg>
  </button>

  <div id="app">Loading...</div>
  <script>
    // Dark mode toggle functionality
    (function() {
      const themeToggle = document.getElementById('theme-toggle');
      const html = document.documentElement;

      // Get saved theme or detect system preference
      function getInitialTheme() {
        const saved = localStorage.getItem('theme');
        if (saved) {
          return saved;
        }
        return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }

      // Apply theme
      function setTheme(theme) {
        html.setAttribute('data-theme', theme);
        localStorage.setItem('theme', theme);
      }

      // Initialize theme
      setTheme(getInitialTheme());

      // Toggle theme on button click
      themeToggle.addEventListener('click', () => {
        const currentTheme = html.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        setTheme(newTheme);
      });

      // Listen for system theme changes
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
        // Only auto-switch if user hasn't manually set a preference
        if (!localStorage.getItem('theme')) {
          setTheme(e.matches ? 'dark' : 'light');
        }
      });
    })();

    // Docsify configuration
    window.$docsify = {
      name: 'Wealtura Server',
      repo: 'fres-sudo/wealtura-server',
      basePath: '/', // Change to '/docs/' if deploying to a subdirectory, or '/repo-name/' for GitHub Pages project sites
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      coverpage: false,
      notFoundPage: true,
      homepage: 'README.md',
      search: {
        maxAge: 86400000, // Expiration time, the unit is one day
        paths: 'auto',
        placeholder: 'Search documentation...',
        noData: 'No Results!',
        depth: 6
      },
      pagination: {
        previousText: '← Previous',
        nextText: 'Next →',
        crossChapter: true,
        crossChapterText: true,
      },
      // Custom footer
      executeScript: true,
      mergeNavbar: true,
      formatUpdated: '{YYYY}-{MM}-{DD} {HH}:{mm}',
      // External link target
      externalLinkTarget: '_blank',
      // Copy code button
      copyCode: {
        buttonText : 'Copy to clipboard',
        errorText  : 'Error',
        successText: 'Copied'
      }
    }
  </script>
  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <!-- Search plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <!-- Copy code plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@2/dist/docsify-copy-code.min.js"></script>
  <!-- Pagination plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
  <!-- External script plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/external-script.min.js"></script>
</body>
</html>
